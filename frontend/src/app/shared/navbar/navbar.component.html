<header *ngIf="navbarMode === 'public'" class="navbar">
  <button type="button" class="logo logo-button" (click)="navigateToLogoRoute()" aria-label="Take Care">
    <img src="assets/images/logo.png" alt="Take Care" />
  </button>

  <nav class="links">
    <a routerLink="/">{{ 'navbar.home' | translate }}</a>
    <a routerLink="/" fragment="nosotros">{{ 'navbar.about' | translate }}</a>
  </nav>

  <div class="actions">
    <select
      class="lang-select"
      [attr.aria-label]="'navbar.language' | translate"
      [value]="languageService.getCurrentLanguage()"
      (change)="changeLanguage($event)">
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>

    <a routerLink="/login" class="btn-outline">
      {{ 'navbar.login' | translate }}
    </a>

    <a routerLink="/register-role" class="btn-primary">
      {{ 'navbar.register' | translate }}
    </a>
  </div>
</header>

<header *ngIf="navbarMode === 'private'" class="navbar private-navbar">

  <button class="menu-toggle" (click)="toggleSidebar()" *ngIf="isDashboard">
    <span class="material-symbols-outlined">
      {{ sidebarService.isOpen() ? 'close' : 'menu' }}
    </span>
  </button>
  
  <button type="button" class="logo logo-button" (click)="navigateToLogoRoute()" aria-label="Take Care">
    <img src="assets/images/logo.png" alt="Take Care" />
    <div class="brand-copy">
      <span *ngIf="!isDashboard">{{ ('navbar.private.' + privateArea + '.label') | translate }}</span>
    </div>
  </button>

  <div *ngIf="isDashboard" class="navbar-spacer"></div>

  <nav class="links private-links" *ngIf="privateArea === 'patient' && !isDashboard">
    <a routerLink="/patient" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
      {{ 'navbar.private.patient.dashboard' | translate }}
    </a>
  </nav>

  <div class="actions private-actions">
    <select
      class="lang-select"
      [attr.aria-label]="'navbar.language' | translate"
      [value]="languageService.getCurrentLanguage()"
      (change)="changeLanguage($event)">
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>

    <button
      *ngIf="privateArea === 'specialist' || privateArea === 'patient'"
      type="button"
      class="notification-bell"
      (click)="toggleNotifications()"
      [attr.aria-label]="((privateArea === 'patient' ? 'patientNotifications' : 'specialistNotifications') + '.open') | translate">
      <span class="material-symbols-outlined">notifications</span>
      <span class="notification-badge" *ngIf="notificationCount > 0">
        {{ notificationCount > 99 ? '99+' : notificationCount }}
      </span>
    </button>

    <div class="user-pill" *ngIf="user">
      <span class="material-symbols-outlined">account_circle</span>
      <span>{{ user.names }}</span>
    </div>

    <button type="button" class="btn-outline private-logout" (click)="logout()">
      {{ 'navbar.private.common.logout' | translate }}
    </button>
  </div>
</header>

<app-specialist-notifications-sidebar
  *ngIf="privateArea === 'specialist' || privateArea === 'patient'"
  [userId]="user?.id ?? null"
  [audience]="privateArea === 'patient' ? 'patient' : 'specialist'"
  [isOpen]="notificationsOpen"
  (closePanel)="closeNotifications()">
</app-specialist-notifications-sidebar>
